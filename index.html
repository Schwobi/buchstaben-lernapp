<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Buchstaben-Spaß</title>
  <meta name="description" content="Buchstaben nachfahren und lernen für Kindergartenkinder">
  <meta name="theme-color" content="#7c5cff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Buchstaben">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/andika-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Startseite: Buchstaben auswählen -->
  <main id="home" class="screen active">
    <header class="topbar">
      <div class="logo" aria-hidden="true">A<span>b</span>C</div>
      <div class="score" aria-label="Punkte"><span class="star">⭐</span><span class="total">0</span></div>
    </header>

    <div class="case-toggle" role="group" aria-label="Groß oder klein">
      <button class="case-btn active" data-case="upper" aria-label="Großbuchstaben">ABC</button>
      <button class="case-btn" data-case="lower" aria-label="Kleinbuchstaben">abc</button>
    </div>

    <div id="grid" class="grid"></div>
  </main>

  <!-- Nachfahren -->
  <main id="trace" class="screen">
    <header class="topbar">
      <button class="round-btn" id="btn-home" aria-label="Zur Übersicht">🏠</button>
      <button class="hint" id="btn-speak" aria-label="Vorlesen">
        <span class="hint-emoji" id="hint-emoji"></span>
        <span class="hint-speaker">🔊</span>
      </button>
      <div class="score" aria-label="Punkte"><span class="star">⭐</span><span class="total">0</span></div>
    </header>

    <div class="board" id="board">
      <canvas id="canvas"></canvas>
    </div>

    <footer class="actions">
      <button class="round-btn big" id="btn-clear" aria-label="Löschen">↺</button>
      <button class="round-btn big go" id="btn-done" aria-label="Fertig">✓</button>
      <button class="round-btn big" id="btn-next" aria-label="Nächster Buchstabe">➜</button>
    </footer>

    <!-- Ergebnis -->
    <div class="result" id="result" hidden>
      <div class="result-card">
        <div class="result-stars" id="result-stars"></div>
        <div class="result-points" id="result-points"></div>
        <div class="result-actions">
          <button class="round-btn big" id="btn-again" aria-label="Nochmal">↺</button>
          <button class="round-btn big go" id="btn-result-next" aria-label="Weiter">➜</button>
        </div>
      </div>
      <canvas id="confetti"></canvas>
    </div>
  </main>


  <script type="module" src="js/app.js"></script>
</body>
</html>
